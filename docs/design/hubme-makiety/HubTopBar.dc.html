<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FFFFFF}a{color:#2462AD}a:hover{color:#0F4A91}</style>
</helmet>
<header style="background:#FFFFFF;border-bottom:1px solid #E6E6E6;font-family:'Red Hat Display',system-ui,sans-serif;color:#292929">
  <div style="display:flex;align-items:center;gap:18px;padding:0 32px;height:76px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:34px;height:34px;border-radius:4px;background:#2462AD;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:19px">H</span>
      <span style="font-size:24px;font-weight:600;letter-spacing:-.01em">HubMe</span>
    </div>
    <nav aria-label="Główna" style="display:flex;gap:2px;height:100%">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
        <sc-if value="{{ item.isActive }}" hint-placeholder-val="{{ false }}">
          <a href="#" aria-current="page" style="display:flex;align-items:center;padding:0 9px;font-size:15px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:#2462AD;text-decoration:none;white-space:nowrap;border-bottom:3px solid #2462AD;border-top:4px solid transparent">{{ item.label }}</a>
        </sc-if>
        <sc-if value="{{ item.notActive }}" hint-placeholder-val="{{ true }}">
          <a href="#" style="display:flex;align-items:center;padding:0 9px;font-size:15px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:#292929;text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;border-top:4px solid transparent">{{ item.label }}</a>
        </sc-if>
      </sc-for>
    </nav>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex:none">
      <button aria-label="Powiększ tekst" style="min-width:48px;height:44px;border:1px solid #8A8A8A;background:#FFFFFF;border-radius:4px;font:inherit;font-weight:600;font-size:18px;color:#292929">A+</button>
      <div role="switch" aria-checked="false" style="display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 8px;border:1px solid #8A8A8A;border-radius:4px;background:#FFFFFF;font-size:16px;font-weight:600;white-space:nowrap">
        <span style="width:40px;height:24px;border-radius:4px;background:#BDBDBD;position:relative;display:inline-block"><span style="position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:9px;background:#FFFFFF"></span></span>Prosty język
      </div>
      <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
        <button aria-label="Powiadomienia, {{ notif }} nieprzeczytane" style="position:relative;width:48px;height:44px;border:1px solid #8A8A8A;background:#FFFFFF;border-radius:4px;display:flex;align-items:center;justify-content:center">
          <span style="position:relative;width:20px;height:22px;display:inline-block"><span style="position:absolute;left:3px;top:1px;width:10px;height:13px;border:2px solid #292929;border-bottom:none;border-radius:8px 8px 0 0"></span><span style="position:absolute;left:0;top:15px;width:20px;height:2px;background:#292929"></span><span style="position:absolute;left:8px;top:18px;width:4px;height:4px;border-radius:2px;background:#292929"></span></span>
          <span style="position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:4px;background:#2462AD;color:#FFFFFF;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF">{{ notif }}</span>
        </button>
        <a href="#" style="display:flex;align-items:center;height:44px;padding:0 6px;font-size:17px;font-weight:600;color:#292929;text-decoration:none;white-space:nowrap">Moje sprawy</a>
        <span style="width:44px;height:44px;border-radius:22px;background:#E6F2EA;color:#1E7A3C;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px">{{ initials }}</span>
      </sc-if>
      <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}">
        <a href="#" style="display:flex;align-items:center;height:44px;padding:0 16px;border-radius:4px;font-size:17px;font-weight:600;color:#2462AD;text-decoration:none;white-space:nowrap;border:2px solid #2462AD">Zaloguj się</a>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ showAi }}" hint-placeholder-val="{{ true }}">
    <div role="note" aria-live="polite" style="display:flex;align-items:center;gap:14px;padding:10px 32px;background:#E8F0F9;border-top:1px solid #2462AD;border-bottom:1px solid #2462AD;font-size:16px;color:#333333">
      <span style="display:inline-flex;align-items:center;height:26px;padding:0 8px;border:1.5px dashed #292929;border-radius:4px;font-size:14px;font-weight:600;letter-spacing:.04em;color:#292929;background:#FFFFFF">AI</span>
      <span>Wyniki przygotowuje system AI na podstawie bazy przetestowanych innowacji. <strong style="color:#0F4A91">Decyzję podejmuje człowiek.</strong></span>
      <a href="#" style="margin-left:auto;font-weight:600;color:#2462AD">Wolisz porozmawiać z człowiekiem?</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:130},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Znajdź rozwiązanie&quot;,&quot;Biblioteka innowacji&quot;,&quot;Wyzwania Małopolski&quot;,&quot;Zgłoś pomysł&quot;,&quot;Nabory&quot;,&quot;&quot;],&quot;default&quot;:&quot;Znajdź rozwiązanie&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;loggedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;notif&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;showAi&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AK&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? '';
    const navItems = ['Znajdź rozwiązanie','Biblioteka innowacji','Wyzwania Małopolski','Zgłoś pomysł','Nabory'].map(l => ({ label: l, isActive: l === a, notActive: l !== a }));
    const li = !!this.props.loggedIn;
    return { navItems, loggedIn: li, loggedOut: !li, notif: this.props.notif ?? 3, showAi: this.props.showAi ?? true, initials: this.props.initials ?? 'AK' };
  }
}
</script>
</body>
</html>
